CONFIG_ZMK_KEYBOARD_NAME="Module Test"
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000
# Disable console by default to disable board_cdc_acm_uart
# CONSOLE is enabled when -S zmk-usb-logging is specified
CONFIG_CONSOLE=n

# Buffer budget for custom settings and the runtime-accel RPC (see
# DESIGN.md section 5 and the BUILD_ASSERTs in
# src/studio/runtime_accel_handler.c).
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=192
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=192
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=128
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
